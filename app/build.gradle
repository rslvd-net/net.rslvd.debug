plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing config is loaded from keystore.properties (kept out of version
// control). If absent, release builds fall back to the debug signing key so the
// project always builds.
def keystorePropsFile = rootProject.file("keystore.properties")
def hasKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'net.rslvd.terminal'
    compileSdk 36

    defaultConfig {
        // The package name is fixed: every binary in the rslvd bootstrap/apt repo
        // is compiled with prefix /data/data/net.rslvd.debug/files/usr.
        applicationId 'net.rslvd.debug'
        minSdk 26
        // targetSdk 28 so the app may exec downloaded binaries from its data
        // dir (Android 10+ W^X blocks this for targetSdk >= 29 — same reason
        // Termux's sideload build targets 28).
        targetSdk 28
        // versionCode continues from the "full" flavour of the rslvd client app
        // (last shipped as 20) so existing installs upgrade in place and keep
        // their bootstrap.
        versionCode 21
        versionName '1.0'
        vectorDrawables { useSupportLibrary true }
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        // targetSdk 28 is deliberate (sideload-only, see README); not a Play app.
        disable 'ExpiredTargetSdkVersion'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.02.02')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'

    // PTY-backed terminal (vendored from termux-app, Apache-2.0)
    implementation project(':terminal-view')
}
